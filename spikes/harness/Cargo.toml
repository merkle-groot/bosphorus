[package]
name = "spike-harness"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# In-process spike runners on an in-memory V03State (no sequencer).
[dependencies]
lee.workspace = true
lee_core.workspace = true
spike-methods.workspace = true
spike-guest = { path = "../methods/guest" }
borsh.workspace = true
anyhow.workspace = true
program_loader_core.workspace = true
# S4 stage timing: risc0's in-process prover logs `prove_session`/`prove_segment_core` at debug.
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[features]
# In-process prover (instead of r0vm over IPC). On Apple silicon this uses the Metal GPU backend;
# building it needs Xcode's `metal` compiler.
prove = ["lee/prove"]
