[package]
name = "bosphorus-app"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# The app API: JSON in, JSON out, for front-ends (a Basecamp module, a local web UI). `bos-app`
# serves it as JSON lines over stdin/stdout.
[[bin]]
name = "bos-app"
path = "src/main.rs"

[dependencies]
bosphorus-client = { path = "../client" }
bosphorus-core.workspace = true
lee.workspace = true
wallet.workspace = true
anyhow.workspace = true
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "time", "sync", "io-util", "io-std"] }
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
