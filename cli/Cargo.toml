[package]
name = "bosphorus-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "bos"
path = "src/main.rs"

[dependencies]
bosphorus-client = { path = "../client" }
bosphorus-core.workspace = true
lee.workspace = true
lee_core.workspace = true
common.workspace = true
borsh.workspace = true
bosphorus-lending.workspace = true
bosphorus-pool.workspace = true
bosphorus-token.workspace = true
anyhow.workspace = true
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.50", features = ["macros", "rt-multi-thread"] }

[features]
prove = ["bosphorus-client/prove"]
