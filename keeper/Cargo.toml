[package]
name = "bosphorus-keeper"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Liquidation keeper (design §7): discovers positions by scanning blocks, liquidates unhealthy ones
# with public txs. Reference quality, not production.
[[bin]]
name = "bos-keeper"
path = "src/main.rs"

[dependencies]
bosphorus-client = { path = "../client" }
bosphorus-core.workspace = true
lee.workspace = true
anyhow.workspace = true
clap = { version = "4.5", features = ["derive"] }
tokio = { version = "1.50", features = ["macros", "rt-multi-thread", "time"] }
