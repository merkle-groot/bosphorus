[package]
name = "bosphorus-methods"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Builds the program guests with the local risc0 toolchain (no Docker here, so image ids differ
# from a Docker build) and embeds `TOKEN_ELF`, `ORACLE_ELF`, ...
[build-dependencies]
risc0-build.workspace = true

# Only for the real-proof tests (`--features prove`): our proving schedule.
[dependencies]
bosphorus-prover = { workspace = true, optional = true }

[package.metadata.risc0]
# Token and oracle are pinned to their deployed ELFs (src/lib.rs).
methods = ["../lending/guest", "../pool/guest", "../disclosure", "../test-caller"]

# Essential tests (money safety + authorisation), run in-process on `V03State`.
[dev-dependencies]
lee.workspace = true
lee_core.workspace = true
program_loader_core.workspace = true
bosphorus-token.workspace = true
bosphorus-oracle.workspace = true
bosphorus-lending.workspace = true
bosphorus-pool.workspace = true
bosphorus-disclosure.workspace = true
risc0-zkvm.workspace = true
bincode = "1.3"
bosphorus-core.workspace = true
borsh.workspace = true
anyhow.workspace = true

[features]
prove = ["lee/prove", "dep:bosphorus-prover"]
