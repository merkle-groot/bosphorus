[package]
name = "bosphorus-client"
version = "0.1.0"
edition.workspace = true
license.workspace = true

# Client library on top of LEZ's `wallet`: deploys, state readers, tx builders.
[dependencies]
wallet.workspace = true
common.workspace = true
lee.workspace = true
lee_core.workspace = true
program_loader_core.workspace = true
bosphorus-core.workspace = true
bosphorus-token.workspace = true
bosphorus-oracle.workspace = true
bosphorus-lending.workspace = true
sequencer_service_rpc.workspace = true
bosphorus-methods.workspace = true
anyhow.workspace = true
borsh.workspace = true
hmac = "0.12"
# The same as LEZ's wallet: recovery phrases (funds.rs).
bip39 = "2.2.0"
serde_json = "1.0"
sha2.workspace = true
bosphorus-prover = { workspace = true, optional = true }

[features]
# In-process proving uses the patched host backends, including Metal on Apple silicon.
prove = ["lee/prove", "dep:bosphorus-prover"]
